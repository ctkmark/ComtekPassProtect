<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="/comtek-passprotect-icon.svg?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <title>Page not found — Comtek PassProtect</title>
  <style>
    *, *::after, *::before { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #374151;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .page { max-width: 28rem; width: 100%; text-align: center; }
    .brand { margin-bottom: 2rem; }
    .brand-name { font-size: 1.5rem; font-weight: 700; color: #1f2937; letter-spacing: -0.02em; margin: 0; }
    .brand-tagline { font-size: 0.875rem; color: #6b7280; margin: 0.25rem 0 0; font-weight: 400; }
    .code { font-size: 4rem; font-weight: 700; color: #667eea; letter-spacing: -0.05em; margin: 0 0 0.5rem; line-height: 1; }
    .heading { font-size: 1.25rem; font-weight: 600; color: #1f2937; margin: 0 0 0.5rem; }
    .intro { color: #6b7280; margin: 0 0 1.5rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; }
    .btn {
      display: inline-block; padding: 0.75rem 1.5rem; font-family: inherit; font-size: 0.9375rem; font-weight: 500;
      text-decoration: none; border-radius: 0.5rem; cursor: pointer; transition: background 0.15s, color 0.15s; border: none;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .btn-primary:hover { opacity: 0.95; color: #fff; }
    .help {
      font-size: 0.875rem; color: #6b7280; text-align: left; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 0.5rem; padding: 1rem 1.25rem; margin: 0;
    }
    .help strong { color: #374151; }
    .help .help-text { margin: 0.5rem 0 0; }
    .help a { color: #667eea; text-decoration: none; }
    .help a:hover { text-decoration: underline; }
    .lang-selector { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .lang-flag { background: none; border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 1.5rem; padding: 0.35rem; line-height: 1; transition: border-color 0.15s; }
    .lang-flag:hover { border-color: #e5e7eb; }
    .lang-flag.active { border-color: #667eea; }
    @media (prefers-color-scheme: dark) {
      body {
        color: #e5e7eb;
        background: #111827;
      }
      .brand-name { color: #f9fafb; }
      .brand-tagline { color: #9ca3af; }
      .code { color: #a5b4fc; }
      .heading { color: #f9fafb; }
      .intro { color: #9ca3af; }
      .help {
        color: #9ca3af;
        background: #1f2937;
        border-color: #374151;
      }
      .help strong { color: #e5e7eb; }
      .help a { color: #93c5fd; }
      .lang-flag:hover { border-color: #4b5563; }
      .lang-flag.active { border-color: #818cf8; }
    }
      /* Comtek PassProtect white-first appearance, even with a dark OS preference. */
    html { color-scheme: light; }
    body { background: #FFFFFF !important; color: #17213A !important;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .brand-name { display:flex; justify-content:center; align-items:center; gap:7px;
      font-size:1.35rem; color:#2B2A29 !important; }
    .brand-name img { width:46px; height:46px; border-radius:10px; margin-right:3px; }
    .brand-name .comtek-name { color:#2B2A29 !important; }
    .brand-name .product-name { color:#4B157B !important; }
    .brand-tagline, .intro, .help-text { color:#465166 !important; }
    .heading, .help strong { color:#17213A !important; }
    .code, .help a { color:#4B157B !important; }
    .help { background:#F7F7FB !important; border-color:#E5E8EF !important; color:#465166 !important; }
    .btn-primary { background:#4B157B !important; color:#FFFFFF !important; }
    .btn-primary:hover { background:#39105D !important; }
    .btn-secondary { background:#FFFFFF !important; color:#17213A !important; border:1px solid #E5E8EF !important; }
    .lang-flag.active { border-color:#4B157B !important; }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
      <h1 class="brand-name"><img src="/comtek-passprotect-icon.svg" width="46" height="46" alt=""><span class="comtek-name">Comtek</span> <span class="product-name">PassProtect</span></h1>
      <p class="brand-tagline" data-i18n="brand_tagline">Secure password protection for Comtek</p>
    </div>

    <nav class="lang-selector" aria-label="Select language">
      <button type="button" class="lang-flag" data-lang="en" title="English" aria-pressed="false">&#127482;&#127480;</button>
      <button type="button" class="lang-flag" data-lang="fr" title="Français" aria-pressed="false">&#127467;&#127479;</button>
      <button type="button" class="lang-flag" data-lang="de" title="Deutsch" aria-pressed="false">&#127465;&#127466;</button>
      <button type="button" class="lang-flag" data-lang="nl" title="Nederlands" aria-pressed="false">&#127475;&#127473;</button>
      <button type="button" class="lang-flag" data-lang="es" title="Español" aria-pressed="false">&#127466;&#127480;</button>
      <button type="button" class="lang-flag" data-lang="it" title="Italiano" aria-pressed="false">&#127470;&#127481;</button>
    </nav>

    <p class="code" aria-hidden="true">404</p>
    <h2 class="heading" data-i18n="heading">Page not found</h2>
    <p class="intro" data-i18n="intro">The page you're looking for doesn't exist or may have been moved.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary" data-i18n="btn_home">Go to home page</a>
    </div>

    <section class="help" aria-label="What you can do">
      <strong data-i18n="help_title">What you can do</strong>
      <p class="help-text" data-i18n="help_body">Please return to the home page and try again. If the issue persists, contact Comtek support.</p>
    </section>
  </main>
  <script>
    (function() {
      var STORAGE_KEY = 'pwp_error_lang';
      var SUPPORTED = ['en','fr','de','nl','es','it'];
      function getLocaleFromNavigator() {
        if (!navigator.languages) return 'en';
        for (var i = 0; i < navigator.languages.length; i++) {
          var code = navigator.languages[i].split('-')[0].toLowerCase();
          if (SUPPORTED.indexOf(code) !== -1) return code;
        }
        return 'en';
      }
      function getLocale() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;
        } catch (e) {}
        return getLocaleFromNavigator();
      }
      function setLocale(locale) {
        try { localStorage.setItem(STORAGE_KEY, locale); } catch (e) {}
      }
      function applyTranslations(locale) {
        var t = T[locale] || T.en;
        document.documentElement.lang = locale;
        document.title = (locale === 'en' ? 'Page not found' : t.heading) + ' — Comtek PassProtect';
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
          var key = el.getAttribute('data-i18n');
          if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
          var key = el.getAttribute('data-i18n-html');
          if (t[key]) el.innerHTML = t[key];
        });
        document.querySelectorAll('.lang-flag').forEach(function(btn) {
          var isActive = btn.getAttribute('data-lang') === locale;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }
      var T = {
        en: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Page not found',
          intro: "The page you're looking for doesn't exist or may have been moved.",
          btn_home: 'Go to home page',
          help_title: 'What you can do',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        },
        fr: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Page introuvable',
          intro: 'La page que vous recherchez n\'existe pas ou a peut-être été déplacée.',
          btn_home: 'Aller à l\'accueil',
          help_title: 'Que faire',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        },
        de: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Seite nicht gefunden',
          intro: 'Die gesuchte Seite existiert nicht oder wurde möglicherweise verschoben.',
          btn_home: 'Zur Startseite',
          help_title: 'Was Sie tun können',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        },
        nl: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Pagina niet gevonden',
          intro: 'De pagina die u zoekt bestaat niet of is mogelijk verplaatst.',
          btn_home: 'Naar startpagina',
          help_title: 'Wat u kunt doen',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        },
        es: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Página no encontrada',
          intro: 'La página que busca no existe o puede haber sido movida.',
          btn_home: 'Ir al inicio',
          help_title: 'Qué puede hacer',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        },
        it: {
          brand_tagline: 'Secure password protection for Comtek',
          heading: 'Pagina non trovata',
          intro: 'La pagina che cerchi non esiste o potrebbe essere stata spostata.',
          btn_home: 'Vai alla home',
          help_title: 'Cosa puoi fare',
          help_body: 'Please return to the home page and try again. If the issue persists, contact Comtek support.',
        }
      };
      var locale = getLocale();
      applyTranslations(locale);
      document.querySelectorAll('.lang-flag').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var lang = this.getAttribute('data-lang');
          setLocale(lang);
          applyTranslations(lang);
        });
      });
    })();
  </script>
</body>
</html>
